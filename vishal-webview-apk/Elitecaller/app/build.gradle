plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elitecaller.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.elitecaller.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // ---------------------------------------------------------------
            // SIGNED RELEASE CONFIGURATION PLACEHOLDER
            // ---------------------------------------------------------------
            // To sign your release APK, provide the following either as
            // environment variables / GitHub Secrets, or in a local
            // "keystore.properties" file (never commit real keystores).
            //
            // If no keystore is supplied, the release build automatically
            // falls back to the debug signing config so that GitHub Actions
            // can still produce an installable (unsigned-for-store) APK.
            // ---------------------------------------------------------------
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def hasKeystoreProps = keystorePropertiesFile.exists()

            if (hasKeystoreProps) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def hasKeystoreProps = keystorePropertiesFile.exists()
            def hasEnvKeystore = System.getenv("KEYSTORE_FILE") != null

            if (hasKeystoreProps || hasEnvKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Fallback so CI always produces an installable APK even
                // without release signing secrets configured.
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
