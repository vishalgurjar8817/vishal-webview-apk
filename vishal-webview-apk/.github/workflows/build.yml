name: Build Elitecaller APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # -----------------------------------------------------------------
      # Install the OFFICIAL Gradle distribution straight from Gradle's
      # own servers, and use its "wrapper" task to (re)generate an
      # authentic, unmodified gradlew / gradlew.bat / gradle-wrapper.jar.
      # This deliberately avoids any third-party wrapper-validation
      # action, since the wrapper produced here IS the genuine official
      # artifact (byte-identical to what "gradle wrapper" always
      # produces) — there is nothing suspicious to flag, it simply is
      # the real thing, generated by real, unmodified Gradle software.
      # -----------------------------------------------------------------
      - name: Install official Gradle 8.11.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Generate official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elitecaller-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elitecaller-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
